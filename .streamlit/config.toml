[global]
developmentMode = false

[server]
address = "127.0.0.1"
port = 8508
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[logger]
level = "warning"

[theme]
base = "light"
primaryColor = "#7d3d48"
backgroundColor = "#faf8f4"
secondaryBackgroundColor = "#f0ece5"
textColor = "#302d29"
