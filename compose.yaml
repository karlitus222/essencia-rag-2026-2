name: essencia-rag
services:
  qdrant:
    image: qdrant/qdrant:v1.20.2@sha256:d277592721d2e3b73f9b797b53cf05e6a5bb2134f6d13fdbda4ca51782afbcac
    ports:
      - "127.0.0.1:6336:6333"
    volumes:
      - vetores:/qdrant/storage
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    ports:
      - "127.0.0.1:11436:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - modelos:/root/.ollama
    restart: unless-stopped
volumes:
  vetores:
  modelos:
